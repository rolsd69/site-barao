<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Barão Antonina</title>
     <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'sans-serif';
            background-color: white;
        }

        .breacking-news {
            background: #ff0000;
            padding: 0.5rem 0;
            font-size: 0.0rem;
            color: white;
        }

        .ticker-wrap{
            overflow: hidden;
            white-space: nowrap;

        }

        .ticker {
            display: inline-block;
            animation: ticker 30s linear infinite;
        }

        @keyframes ticker {
            0% {transform: translateX(100%);}
            100% {transform: translateX(-100%);}
        }
    </style>


</head>
<body>

    <div class="breacking-news">
        <div class="container">
            <div class="d-felx align-items-center">
                 <span class="badge bg-white text-danger me-3">Última Notícia</span>
                 <div class="ticker-wrap flex-grow-1">
                    <div class="ticker">
                       📰 Última notícia do colégio. 💕Confira nosso site
                    </div>
                 </div>
            </div>
        </div>
    </div>


    
</body>
</html>
